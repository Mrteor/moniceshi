<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>小手机</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#dfe5ee">
<style>
/* ===== 颜色/玻璃参数：集中在这里改 ===== */
:root{--bg1:#cfd8e6;--bg2:#eadfe8;--ink:#222;--soft:#667;--ac:#4a8cff;
--glass:rgba(255,255,255,.42);--bd:rgba(255,255,255,.75);--blur:18px;--r:20px;
--sh:0 8px 30px rgba(40,50,80,.14);--me:#a6ec7e;--ta:rgba(255,255,255,.92)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#cdd5e2;color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#app{position:relative;height:100dvh;max-width:450px;margin:auto;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
#app:before,#app:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(60px);opacity:.55;background:var(--ac);top:-60px;left:-60px}
#app:after{background:#e9b8c9;top:auto;left:auto;right:-60px;bottom:-40px}
.glass{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(170%);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--bd);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.85)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);z-index:1}
.screen.active{display:flex}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;margin:8px;border-radius:var(--r);min-height:54px}
.back{font-size:30px;line-height:1;padding:0 8px;cursor:pointer}
.ttl{flex:1;text-align:center;font-weight:600;margin-right:30px}.ttl small{display:block;font-weight:400;font-size:11px;color:var(--soft)}
.body{flex:1;overflow-y:auto;padding:4px 12px 20px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;border:0;border-radius:14px;padding:10px 16px;min-height:44px;background:var(--glass);border:1px solid var(--bd);color:var(--ink);cursor:pointer;transition:transform .6s cubic-bezier(.34,1.9,.4,1)}
